[package]
name = "wnvctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Overclocking, undervolting, power limit and fan curves for NVIDIA GPUs on Linux (Wayland and X11)"
license = "MIT"
authors = ["deddroid <deddo9412@gmail.com>"]
repository = "https://github.com/deddroid/wnvidia-control"
readme = "README.md"
keywords = ["nvidia", "gpu", "overclock", "fan-curve", "wayland"]
categories = ["command-line-utilities", "hardware-support"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png", "dep:ksni", "dep:tokio"]

[[bin]]
name = "wnvctl"
path = "src/main.rs"

[[bin]]
name = "wnvctl-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
nix = { version = "0.30", features = ["socket", "user", "fs"] }
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
ksni = { version = "0.3", optional = true }
png = { version = "0.18", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"], optional = true }

[profile.release]
codegen-units = 1
